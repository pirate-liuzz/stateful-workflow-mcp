<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <rect width="1080" height="1440" fill="#0d1117"/>
  <rect x="48" y="48" width="984" height="1344" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="48" y="48" width="984" height="74" rx="22" fill="#21262d"/>
  <circle cx="88" cy="85" r="10" fill="#ff5f57"/><circle cx="120" cy="85" r="10" fill="#febc2e"/><circle cx="152" cy="85" r="10" fill="#28c840"/>
  <text x="540" y="93" text-anchor="middle" fill="#c9d1d9" font-family="Menlo, Monaco, monospace" font-size="23">sample-workflow.yaml</text>
  <g font-family="Menlo, Monaco, monospace" font-size="23">
    <text x="85" y="170" fill="#8b949e">01</text><text x="140" y="170" fill="#8b949e"># 一个 4 步线性流程：验证严格按顺序推进</text>
    <text x="85" y="225" fill="#8b949e">02</text><text x="140" y="225" fill="#ff7b72">name:</text><text x="215" y="225" fill="#a5d6ff"> research-to-report</text>
    <text x="85" y="275" fill="#8b949e">03</text><text x="140" y="275" fill="#ff7b72">description:</text><text x="302" y="275" fill="#a5d6ff"> 从调研到成稿的 4 步流程</text>
    <text x="85" y="350" fill="#8b949e">05</text><text x="140" y="350" fill="#ff7b72">steps:</text>
    <text x="85" y="420" fill="#8b949e">06</text><text x="140" y="420" fill="#79c0ff">  - id:</text><text x="240" y="420" fill="#a5d6ff"> research</text>
    <text x="85" y="465" fill="#8b949e">07</text><text x="180" y="465" fill="#ff7b72">description:</text><text x="342" y="465" fill="#a5d6ff"> 调研主题</text>
    <text x="85" y="510" fill="#8b949e">08</text><text x="180" y="510" fill="#ff7b72">instruction:</text><text x="340" y="510" fill="#a5d6ff"> 产出 3 条关键事实</text>
    <text x="85" y="600" fill="#8b949e">12</text><text x="140" y="600" fill="#79c0ff">  - id:</text><text x="240" y="600" fill="#a5d6ff"> analyze</text>
    <text x="85" y="645" fill="#8b949e">13</text><text x="180" y="645" fill="#ff7b72">description:</text><text x="342" y="645" fill="#a5d6ff"> 分析事实</text>
    <text x="85" y="690" fill="#8b949e">14</text><text x="180" y="690" fill="#ff7b72">instruction:</text><text x="340" y="690" fill="#a5d6ff"> 提炼 2 个核心洞察</text>
    <text x="85" y="780" fill="#8b949e">18</text><text x="140" y="780" fill="#79c0ff">  - id:</text><text x="240" y="780" fill="#a5d6ff"> draft</text>
    <text x="85" y="825" fill="#8b949e">19</text><text x="180" y="825" fill="#ff7b72">description:</text><text x="342" y="825" fill="#a5d6ff"> 起草段落</text>
    <text x="85" y="870" fill="#8b949e">20</text><text x="180" y="870" fill="#ff7b72">instruction:</text><text x="340" y="870" fill="#a5d6ff"> 写 100 字内总结</text>
    <text x="85" y="960" fill="#8b949e">24</text><text x="140" y="960" fill="#79c0ff">  - id:</text><text x="240" y="960" fill="#a5d6ff"> save</text>
    <text x="85" y="1005" fill="#8b949e">25</text><text x="180" y="1005" fill="#ff7b72">description:</text><text x="342" y="1005" fill="#a5d6ff"> 保存结果</text>
    <text x="85" y="1050" fill="#8b949e">26</text><text x="180" y="1050" fill="#ff7b72">instruction:</text><text x="340" y="1050" fill="#a5d6ff"> 确认最终产物并收尾</text>
  </g>
  <path d="M900 440 v120 M875 535 l25 25 25-25" fill="none" stroke="#3fb950" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M900 620 v120 M875 715 l25 25 25-25" fill="none" stroke="#3fb950" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M900 800 v120 M875 895 l25 25 25-25" fill="none" stroke="#3fb950" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="86" y="1150" width="860" height="144" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text x="120" y="1212" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="29" font-weight="700">状态机只激活当前步骤</text>
  <text x="120" y="1260" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="23">未完成 research，就不能报告 analyze、draft 或 save。</text>
  <text x="90" y="1350" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="19">发布说明：此图基于项目内 sample-workflow.yaml 原文节选排版。</text>
</svg>
